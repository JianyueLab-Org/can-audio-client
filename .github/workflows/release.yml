# 推到 main 就编译、测试、打包、自动进一位补丁号、发 Release。手动触发（workflow_dispatch）
# 只出产物挂在 Actions 里，方便试包而不占版本号。往 main 开的 PR 同样跑测试和打包，但不发布——
# 不然 PR 上什么检查都没有，合进 main 的那一下就直接发版了。
#
# 版本号规则：**只有 v1.0.xxx 的 xxx 会自动动。** 主次版本（1.0）是人的决定，写在
# ui/src/ControllerClient/ControllerClient.csproj 的 <CanVersion> 里，这个工作流从那一行推出系列；
# 补丁号是数已有的 v1.0.* 标签取最大加一，一个都没有就从 .0 开始（所以第一次发 v1.0.0）。
# 想发 1.1 就把 CanVersion 改成 1.1.0，下一次推送自动从 v1.1.0 开始。系列只有 csproj 一处，
# 不会出现"工作流在老系列递增、源码报新系列"的两份版本号。
#
# 为什么不让仓库自己维护补丁号：那需要每次发版回推一个提交改文件，而那个提交又会触发这个工作流，
# 自己咬自己。数标签没有这个问题——标签就是已发布版本的唯一事实来源。
#
# Python 语音引擎不在本仓库：每次运行都取 JianyueLab-Org/can-audio 的 new-client-sys **最新提交**
# 编进 can-voice.exe。提交号在 version 这一步解析一次，之后所有 job 检出同一个提交——不然中途有人
# 推了 can-audio，测试过的和打进包里的就不是同一份代码。用的是哪个提交写在 Release 说明和包里的
# controller/voice-engine.txt 里。
#
# 三个系统各在自己的 runner 上打（PyInstaller 不支持交叉编译）：
#   Windows x64 → zip；Linux x64 → tar.gz + 填好版本和校验和的 Arch PKGBUILD（Ubuntu 22.04 上编，
#   glibc 2.35 起的发行版都能跑）；macOS 在 Apple 芯片和 Intel 两台 runner 上各打一份，
#   再合成一个通用的 CAN Audio.app（packaging/macos/make-app.sh）。

name: 编译与发布

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write        # 打标签、建 Release 都要写权限

# 两次推送挨得很近时会同时算出同一个补丁号，然后第二个打标签失败。串行化，后面那个会重新数一遍。
# PR 不发版，各用各的组、新推送取消旧的一轮，免得排在发版后面。
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VOICE_REPO: JianyueLab-Org/can-audio
  VOICE_REF: new-client-sys
  # runner 的 stdout 默认是 cp1252，而语音引擎的日志和 requirements 注释全是中文
  PYTHONUTF8: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.next.outputs.number }}       # 1.0.7
      tag: ${{ steps.next.outputs.tag }}             # v1.0.7
      voice_sha: ${{ steps.voice.outputs.sha }}      # can-audio new-client-sys 的提交
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # 要看到全部标签
      - id: next
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          series=$(sed -n 's:.*<CanVersion>\([0-9][0-9]*\.[0-9][0-9]*\)\.[0-9][0-9]*</CanVersion>.*:\1:p' \
                   ui/src/ControllerClient/ControllerClient.csproj | head -1)
          if [ -z "$series" ]; then echo "csproj 里读不出 CanVersion"; exit 1; fi
          # 只看本系列的标签，取补丁号最大的那个。一个都没有就从 0 开始。
          latest=$(git tag -l "v${series}.*" \
                   | sed -n "s/^v${series}\.\([0-9][0-9]*\)$/\1/p" \
                   | sort -n | tail -1)
          next=$(( ${latest:--1} + 1 ))
          echo "number=${series}.${next}" >> "$GITHUB_OUTPUT"
          echo "tag=v${series}.${next}"   >> "$GITHUB_OUTPUT"
          echo "系列 ${series}，上一个补丁号 ${latest:-（无）}，这次发 v${series}.${next}"
      - id: voice
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git ls-remote "https://github.com/${VOICE_REPO}.git" "refs/heads/${VOICE_REF}" | cut -f1)
          if [ -z "$sha" ]; then echo "找不到 ${VOICE_REPO} 的 ${VOICE_REF} 分支"; exit 1; fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "语音引擎：${VOICE_REPO} ${VOICE_REF} @ ${sha}"

  rnnoise:
    # denoise.py 的原生库。用 can-audio 的 native/rnnoise 从 xiph v0.2 发布包构建（SHA-256 固定在脚本里），
    # 不进仓库；test 和 build 都从这里拿。
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.VOICE_REPO }}
          ref: ${{ needs.version.outputs.voice_sha }}
          path: can-audio
      - uses: actions/cache@v6
        id: cache
        with:
          path: can-audio/native/rnnoise/out
          key: rnnoise-0.2-${{ hashFiles('can-audio/native/rnnoise/CMakeLists.txt', 'can-audio/native/rnnoise/build.ps1', 'can-audio/native/rnnoise/compat/os_support.h') }}
      - name: 构建 rnnoise.dll
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./can-audio/native/rnnoise/build.ps1 -Out can-audio/native/rnnoise/out
      - uses: actions/upload-artifact@v7
        with:
          name: rnnoise-dll
          path: can-audio/native/rnnoise/out/
          if-no-files-found: error

  test:
    # 和 build 并行。测试没过就不发——release 同时依赖两者。
    needs: [version, rnnoise]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.VOICE_REPO }}
          ref: ${{ needs.version.outputs.voice_sha }}
          path: can-audio
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'   # PyAudio 没有 3.13+ 的 wheel
          cache: pip
          cache-dependency-path: can-audio/requirements-*.txt
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: |
          python -m pip install --upgrade pip
          pip install -r can-audio/requirements-build.txt
      - uses: actions/download-artifact@v8
        with:
          name: rnnoise-dll
          path: can-audio/controller

      - name: 语音引擎单元测试
        working-directory: can-audio/controller
        run: |
          # opuslib 用 ctypes 运行时加载 opus；controller/ 里带着 opus.dll，放进 DLL 搜索路径
          $env:PATH = "$PWD;$env:PATH"
          python -m unittest discover -p "test_*.py"
          if ($LASTEXITCODE) { throw "can-audio controller/ 的测试没过" }

      - name: C# 检查
        run: |
          dotnet run --project tests/ControllerClient.Checks -c Release
          if ($LASTEXITCODE) { throw "C# 检查没过" }

  build:
    needs: [version, rnnoise]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # build 号用 git rev-list --count HEAD，浅克隆只有一个提交，会得出 build 1
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.VOICE_REPO }}
          ref: ${{ needs.version.outputs.voice_sha }}
          path: can-audio
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: can-audio/requirements-*.txt
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: |
          python -m pip install --upgrade pip
          pip install -r can-audio/requirements-build.txt
      - uses: actions/download-artifact@v8
        with:
          name: rnnoise-dll
          path: can-audio/controller

      - name: 编译并打包
        env:
          # csproj 读它：写进 ControllerClient.exe 的版本号，并标成正式包（不显示 Dev Build）
          CAN_VERSION: ${{ needs.version.outputs.number }}
        # 脚本自己会验包：exe 的版本号、can-voice.exe 带没带 opus.dll / rnnoise.dll、
        # 冻结后的语音引擎能不能真的回协议
        run: ./package-release.ps1 -Python python

      - uses: actions/upload-artifact@v7
        with:
          name: can-audio-client
          path: dist/can-audio-client-*.zip
          if-no-files-found: error

  test-unix:
    # C# 检查在 Linux / macOS 上也跑：子进程管道背压、路径、PTT 键名表都和系统有关
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: C# 检查
        run: dotnet run --project tests/ControllerClient.Checks -c Release

  build-linux:
    needs: version
    # 用较老的 Ubuntu 编：PyInstaller 的引导程序和随包的库要求运行机器的 glibc 不比编译机旧
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.VOICE_REPO }}
          ref: ${{ needs.version.outputs.voice_sha }}
          path: can-audio
      - name: 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends portaudio19-dev libopus0 cmake
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: can-audio/requirements-*.txt
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: |
          python -m pip install --upgrade pip
          pip install -r can-audio/requirements-build.txt pillow
      - name: 构建 librnnoise.so
        run: packaging/build-rnnoise.sh can-audio can-audio/controller
      - name: 编译并打包
        shell: pwsh
        env:
          CAN_VERSION: ${{ needs.version.outputs.number }}
        # 脚本自己会验包：can-voice 带没带 libopus / librnnoise、冻结后的语音引擎能不能回协议
        run: ./package-release.ps1 -Runtime linux-x64 -Python python
      - uses: actions/upload-artifact@v7
        with:
          name: can-audio-client-linux
          path: |
            dist/can-audio-client-*.tar.gz
            dist/PKGBUILD
            dist/can-audio-client.install
          if-no-files-found: error

  build-macos:
    needs: version
    strategy:
      matrix:
        include:
          - runner: macos-15          # Apple 芯片
            rid: osx-arm64
          - runner: macos-15-intel    # Intel
            rid: osx-x64
    runs-on: ${{ matrix.runner }}
    env:
      # opus、PortAudio、rnnoise、PyAudio 都按这个版本编；numpy 的 wheel 本身也要求 14
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.VOICE_REPO }}
          ref: ${{ needs.version.outputs.voice_sha }}
          path: can-audio
      - uses: actions/cache@v6
        id: native
        with:
          # 安装名是绝对路径，缓存还原到同一个位置才能用
          path: ${{ github.workspace }}/native
          key: native-${{ matrix.rid }}-${{ env.MACOSX_DEPLOYMENT_TARGET }}-${{ hashFiles('packaging/macos/build-native.sh') }}
      - name: 构建 libopus、PortAudio
        if: steps.native.outputs.cache-hit != 'true'
        run: packaging/macos/build-native.sh "$GITHUB_WORKSPACE/native"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Python 依赖
        run: |
          python -m pip install --upgrade pip
          # PyAudio 没有 macOS 的 wheel，按上面编的 PortAudio 从源码编
          CFLAGS="-I$GITHUB_WORKSPACE/native/include" LDFLAGS="-L$GITHUB_WORKSPACE/native/lib" \
            pip install --no-binary pyaudio --no-cache-dir pyaudio
          pip install -r can-audio/requirements-build.txt
      - name: 构建 librnnoise.dylib
        run: packaging/build-rnnoise.sh can-audio can-audio/controller
      - name: 编译并打包
        shell: pwsh
        env:
          CAN_VERSION: ${{ needs.version.outputs.number }}
        run: ./package-release.ps1 -Runtime ${{ matrix.rid }} -Python python -OpusLibrary "$env:GITHUB_WORKSPACE/native/lib/libopus.0.dylib"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.rid }}
          path: dist/can-audio-client-*-${{ matrix.rid }}.tar.gz
          if-no-files-found: error

  macos-app:
    # 两种芯片的包合成一个通用 .app：启动器是通用二进制，按本机架构进对应目录
    needs: [version, build-macos]
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: macos-osx-*
          merge-multiple: true
          path: parts
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 合成 CAN Audio.app
        env:
          VERSION: ${{ needs.version.outputs.number }}
        run: |
          set -euo pipefail
          for rid in osx-arm64 osx-x64; do tar -xzf "parts/can-audio-client-$VERSION-$rid.tar.gz" -C parts; done
          pip install pillow
          python packaging/icons.py ui/src/ControllerClient/app.ico icons
          packaging/macos/make-app.sh "$VERSION" "parts/can-audio-client-$VERSION-osx-arm64" \
            "parts/can-audio-client-$VERSION-osx-x64" icons/app.icns out
      - uses: actions/upload-artifact@v7
        with:
          name: can-audio-client-macos
          path: out/can-audio-client-*-macos-universal.zip
          if-no-files-found: error

  release:
    # 只有推到 main 才发。手动触发和 PR 只出产物，方便试包而不占版本号。
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version, test, test-unix, build, build-linux, macos-app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          # can-audio-client（Windows）、-linux、-macos 三份产物放进同一个目录
          pattern: can-audio-client*
          merge-multiple: true
          path: packages

      - name: 生成发布包 SHA-256 清单
        shell: bash
        run: |
          set -euo pipefail
          cd packages
          sha256sum *.zip *.tar.gz > SHA256SUMS
          test -s SHA256SUMS
          cat SHA256SUMS

      - name: 打标签
        # 标签是"已发布版本"的唯一事实来源，下一次就靠它算补丁号
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ needs.version.outputs.tag }}" -m "${{ needs.version.outputs.tag }}"
          git push origin "${{ needs.version.outputs.tag }}"

      - name: 建 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          files: |
            packages/*.zip
            packages/*.tar.gz
            packages/PKGBUILD
            packages/can-audio-client.install
            packages/SHA256SUMS
          generate_release_notes: true
          body: |
            ## CAN Audio 管制语音客户端 ${{ needs.version.outputs.tag }}

            包里自带 .NET 运行时和语音引擎，**无需安装 .NET 或 Python**。

            | 系统 | 下载 | 用法 |
            |---|---|---|
            | Windows x64 | `can-audio-client-${{ needs.version.outputs.number }}-win-x64.zip` | 解压后运行 `ControllerClient.exe`，保留整个目录 |
            | macOS 14+（Apple 芯片 / Intel 通用） | `can-audio-client-${{ needs.version.outputs.number }}-macos-universal.zip` | 解压后把 `CAN Audio.app` 拖进「应用程序」；未经公证，首次打开见 README |
            | Linux x64 | `can-audio-client-${{ needs.version.outputs.number }}-linux-x64.tar.gz` | 解压后运行 `ControllerClient`，`./install.sh` 加菜单入口 |
            | Arch Linux | `PKGBUILD` + `can-audio-client.install` | 放进同一目录后 `makepkg -si` |

            macOS 要在「隐私与安全性」里允许输入监控和麦克风；Linux 的全局 PTT 要求用户在 `input` 组。

            校验：`SHA256SUMS` 里是压缩包的 SHA-256。

            语音引擎：[`${{ env.VOICE_REPO }}@${{ needs.version.outputs.voice_sha }}`](https://github.com/${{ env.VOICE_REPO }}/tree/${{ needs.version.outputs.voice_sha }})
            （`${{ env.VOICE_REF }}` 分支，同样记在包里的 `controller/voice-engine.txt`）。
