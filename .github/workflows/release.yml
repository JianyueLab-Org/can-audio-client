# 推到 main 就编译、测试、打包、自动进一位补丁号、发 Release。手动触发（workflow_dispatch）
# 只出产物挂在 Actions 里，方便试包而不占版本号。
#
# 版本号规则：**只有 v1.0.xxx 的 xxx 会自动动。** 主次版本（1.0）是人的决定，写在
# ui/src/ControllerClient/ControllerClient.csproj 的 <CanVersion> 里，这个工作流从那一行推出系列；
# 补丁号是数已有的 v1.0.* 标签取最大加一，一个都没有就从 .0 开始（所以第一次发 v1.0.0）。
# 想发 1.1 就把 CanVersion 改成 1.1.0，下一次推送自动从 v1.1.0 开始。系列只有 csproj 一处，
# 不会出现"工作流在老系列递增、源码报新系列"的两份版本号。
#
# 为什么不让仓库自己维护补丁号：那需要每次发版回推一个提交改文件，而那个提交又会触发这个工作流，
# 自己咬自己。数标签没有这个问题——标签就是已发布版本的唯一事实来源。
#
# Python 语音引擎不在本仓库：每次运行都取 JianyueLab-Org/can-audio 的 new-client-sys **最新提交**
# 编进 can-voice.exe。提交号在 version 这一步解析一次，之后所有 job 检出同一个提交——不然中途有人
# 推了 can-audio，测试过的和打进包里的就不是同一份代码。用的是哪个提交写在 Release 说明和包里的
# controller/voice-engine.txt 里。
#
# 只能在 Windows 上打：PyAudio、opus.dll 都是 Windows 的，PyInstaller 也不支持交叉编译。

name: 编译与发布

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write        # 打标签、建 Release 都要写权限

# 两次推送挨得很近时会同时算出同一个补丁号，然后第二个打标签失败。串行化，后面那个会重新数一遍。
concurrency:
  group: release
  cancel-in-progress: false

env:
  VOICE_REPO: JianyueLab-Org/can-audio
  VOICE_REF: new-client-sys
  # runner 的 stdout 默认是 cp1252，而语音引擎的日志和 requirements 注释全是中文
  PYTHONUTF8: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.next.outputs.number }}       # 1.0.7
      tag: ${{ steps.next.outputs.tag }}             # v1.0.7
      voice_sha: ${{ steps.voice.outputs.sha }}      # can-audio new-client-sys 的提交
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # 要看到全部标签
      - id: next
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          series=$(sed -n 's:.*<CanVersion>\([0-9][0-9]*\.[0-9][0-9]*\)\.[0-9][0-9]*</CanVersion>.*:\1:p' \
                   ui/src/ControllerClient/ControllerClient.csproj | head -1)
          if [ -z "$series" ]; then echo "csproj 里读不出 CanVersion"; exit 1; fi
          # 只看本系列的标签，取补丁号最大的那个。一个都没有就从 0 开始。
          latest=$(git tag -l "v${series}.*" \
                   | sed -n "s/^v${series}\.\([0-9][0-9]*\)$/\1/p" \
                   | sort -n | tail -1)
          next=$(( ${latest:--1} + 1 ))
          echo "number=${series}.${next}" >> "$GITHUB_OUTPUT"
          echo "tag=v${series}.${next}"   >> "$GITHUB_OUTPUT"
          echo "系列 ${series}，上一个补丁号 ${latest:-（无）}，这次发 v${series}.${next}"
      - id: voice
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git ls-remote "https://github.com/${VOICE_REPO}.git" "refs/heads/${VOICE_REF}" | cut -f1)
          if [ -z "$sha" ]; then echo "找不到 ${VOICE_REPO} 的 ${VOICE_REF} 分支"; exit 1; fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "语音引擎：${VOICE_REPO} ${VOICE_REF} @ ${sha}"

  rnnoise:
    # denoise.py 的原生库。用 can-audio 的 native/rnnoise 从 xiph v0.2 发布包构建（SHA-256 固定在脚本里），
    # 不进仓库；test 和 build 都从这里拿。
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.VOICE_REPO }}
          ref: ${{ needs.version.outputs.voice_sha }}
          path: can-audio
      - uses: actions/cache@v6
        id: cache
        with:
          path: can-audio/native/rnnoise/out
          key: rnnoise-0.2-${{ hashFiles('can-audio/native/rnnoise/CMakeLists.txt', 'can-audio/native/rnnoise/build.ps1', 'can-audio/native/rnnoise/compat/os_support.h') }}
      - name: 构建 rnnoise.dll
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./can-audio/native/rnnoise/build.ps1 -Out can-audio/native/rnnoise/out
      - uses: actions/upload-artifact@v7
        with:
          name: rnnoise-dll
          path: can-audio/native/rnnoise/out/
          if-no-files-found: error

  test:
    # 和 build 并行。测试没过就不发——release 同时依赖两者。
    needs: [version, rnnoise]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.VOICE_REPO }}
          ref: ${{ needs.version.outputs.voice_sha }}
          path: can-audio
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'   # PyAudio 没有 3.13+ 的 wheel
          cache: pip
          cache-dependency-path: can-audio/requirements-*.txt
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: |
          python -m pip install --upgrade pip
          pip install -r can-audio/requirements-build.txt
      - uses: actions/download-artifact@v8
        with:
          name: rnnoise-dll
          path: can-audio/controller

      - name: 语音引擎单元测试
        working-directory: can-audio/controller
        run: |
          # opuslib 用 ctypes 运行时加载 opus；controller/ 里带着 opus.dll，放进 DLL 搜索路径
          $env:PATH = "$PWD;$env:PATH"
          python -m unittest discover -p "test_*.py"
          if ($LASTEXITCODE) { throw "can-audio controller/ 的测试没过" }

      - name: C# 检查
        run: |
          dotnet run --project tests/ControllerClient.Checks -c Release
          if ($LASTEXITCODE) { throw "C# 检查没过" }

  build:
    needs: [version, rnnoise]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # build 号用 git rev-list --count HEAD，浅克隆只有一个提交，会得出 build 1
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.VOICE_REPO }}
          ref: ${{ needs.version.outputs.voice_sha }}
          path: can-audio
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: can-audio/requirements-*.txt
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: |
          python -m pip install --upgrade pip
          pip install -r can-audio/requirements-build.txt
      - uses: actions/download-artifact@v8
        with:
          name: rnnoise-dll
          path: can-audio/controller

      - name: 编译并打包
        env:
          # csproj 读它：写进 ControllerClient.exe 的版本号，并标成正式包（不显示 Dev Build）
          CAN_VERSION: ${{ needs.version.outputs.number }}
        # 脚本自己会验包：exe 的版本号、can-voice.exe 带没带 opus.dll / rnnoise.dll、
        # 冻结后的语音引擎能不能真的回协议
        run: ./package-release.ps1 -Python python

      - uses: actions/upload-artifact@v7
        with:
          name: can-audio-client
          path: dist/can-audio-client-*.zip
          if-no-files-found: error

  release:
    # 只有推到 main 才发。手动触发只出产物，方便试包而不占版本号。
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version, test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: can-audio-client
          path: packages

      - name: 生成发布包 SHA-256 清单
        shell: bash
        run: |
          set -euo pipefail
          cd packages
          sha256sum *.zip > SHA256SUMS
          test -s SHA256SUMS
          cat SHA256SUMS

      - name: 打标签
        # 标签是"已发布版本"的唯一事实来源，下一次就靠它算补丁号
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ needs.version.outputs.tag }}" -m "${{ needs.version.outputs.tag }}"
          git push origin "${{ needs.version.outputs.tag }}"

      - name: 建 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          files: |
            packages/*.zip
            packages/SHA256SUMS
          generate_release_notes: true
          body: |
            ## CAN Audio 管制语音客户端 ${{ needs.version.outputs.tag }}

            下载 `can-audio-client-${{ needs.version.outputs.number }}-win-x64.zip`，解压后运行
            `ControllerClient.exe`。需要 Windows x64；包里自带 .NET 运行时和语音引擎，
            **无需安装 .NET 或 Python**。保留整个目录，不要单独复制 EXE——语音引擎在
            `controller/can-voice.exe`。

            校验：`SHA256SUMS` 里是压缩包的 SHA-256。

            语音引擎：[`${{ env.VOICE_REPO }}@${{ needs.version.outputs.voice_sha }}`](https://github.com/${{ env.VOICE_REPO }}/tree/${{ needs.version.outputs.voice_sha }})
            （`${{ env.VOICE_REF }}` 分支，同样记在包里的 `controller/voice-engine.txt`）。
